services:
  litellm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE:?Set a pinned existing LiteLLM image in .env}
    image: litellm-with-hooks:local
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      CONFIG_FILE_PATH: /etc/litellm/config.yaml
    ports:
      - "127.0.0.1:9108:9108"
    volumes:
      - ./config.yaml:/etc/litellm/config.yaml:ro
      - ../shared/proxy_app.py:/opt/litellm-hooks/proxy_app.py:ro
      - ../shared/proxy_hooks:/opt/litellm-hooks/proxy_hooks:ro
    command: ["--host", "0.0.0.0", "--port", "9108", "--workers", "2"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
